<script>
  function submitLaporan(event) {
    event.preventDefault(); 
    
    const btn = document.getElementById('btnSimpan');
    const pesan = document.getElementById('pesanStatus');

    
    btn.innerText = \"Memproses Data...\";
    btn.disabled = true;
    btn.classList.add('opacity-50', 'cursor-not-allowed');

    
    const dataForm = {
      namaPengisi: document.getElementById('namaPengisi').value,
      nipPengisi: document.getElementById('nipPengisi').value,
      lokasi: document.getElementById('lokasi').value,
      responseTime: document.getElementById('responseTime').value,
      penyebab: document.getElementById('penyebab').value,
      korban: document.getElementById('korban').value,
      kerugian: document.getElementById('kerugian').value
    };

    
    google.script.run
      .withSuccessHandler(function(response) {
        
        pesan.innerText = response;
        pesan.className = \"mt-3 text-sm text-center text-emerald-400 block\";
        
        
        btn.innerText = \"Simpan Data ke Database\";
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
        
        
        document.getElementById('formLaporan').reset();
        
        
        
      })
      .withFailureHandler(function(error) {
        
        pesan.innerText = \"Error: Terjadi kesalahan saat menyimpan data.\";
        pesan.className = \"mt-3 text-sm text-center text-red-500 block\";
        
        btn.innerText = \"Coba Lagi\";
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
      })
      .simpanLaporan(dataForm);
  }
<\/script>

        \/\/ Incident Actions (RISKP)
        function submitNewIncident(event) {
            event.preventDefault();

            const title = document.getElementById('add-i-title').value;
            const type = document.getElementById('add-i-type').value;
            const priority = document.getElementById('add-i-priority').value;
            const location = document.getElementById('add-i-location').value;
            const city = document.getElementById('add-i-city').value;
            const reporter = document.getElementById('add-i-reporter').value || \"Masyarakat Umum\";
            const desc = document.getElementById('add-i-desc').value || \"Laporan baru masuk, butuh konfirmasi lanjutan.\";

            \/\/ Preset coords for East Kalimantan based on city
            let coords = [-0.5022, 117.1536]; \/\/ Samarinda defaults
            if (city === 'Balikpapan') coords = [-1.2653, 116.8961];
            else if (city === 'Kutai Kartanegara') coords = [-0.4144, 116.9856];
            else if (city === 'Kutai Timur') coords = [0.8972, 117.5856];
            else if (city === 'Berau') coords = [2.1481, 117.4856];
            else if (city === 'Paser') coords = [1.43517, 116.23535];

            const newId = `ID-DMK-2026-0${incidentsDB.length + 1}`;
            const timeString = new Date().toLocaleTimeString('id-ID', { hour12: false }) + ' WITA';

            const newIncident = {
                id: newId,
                title,
                type,
                status: \"Aktif\",
                priority,
                location,
                coords,
                reporter,
                desc,
                time: timeString,
                loss: Math.floor(Math.random() * 500000000) + 10000000 \/\/ Random loss
            };

            incidentsDB.unshift(newIncident);
            
            \/\/ Re-render
            renderIncidentsList();
            renderActivityFeed();
            renderMapMarkers();
            
            \/\/ Re-center map to the new incident coords
            if (map) {
                map.setView(coords, 10);
            }

            closeModal('modal-add-incident');
            document.getElementById('form-add-incident').reset();

            showToast(\"ALARM KEBAKARAN!\", `Laporan ${title} di ${city} telah dikirim ke Peta Spasial.`, \"danger\");
        }

                renderActivityFeed();
                renderMapMarkers();
                showToast(\"Dihapus\", `Laporan ${title} telah dihapus dari log sistem.`, \"warning\");

        \/\/ --- Toast Notifications System ---
        function showToast(title, msg, type = \"info\") {
            const toastContainer = document.getElementById('toast-container');
            
            let colorClasses = \"bg-slate-900 text-slate-100 border-slate-700\";
            let icon = \"fa-info-circle text-blue-400\";

            if (type === \"success\") {
                colorClasses = \"bg-slate-900 border-emerald-500\/50 text-slate-100\";
                icon = \"fa-check-circle text-emerald-400\";
            } else if (type === \"warning\") {
                colorClasses = \"bg-slate-900 border-amber-500\/50 text-slate-100\";
                icon = \"fa-triangle-exclamation text-amber-400\";
            } else if (type === \"danger\") {
                colorClasses = \"bg-red-950\/90 border-red-600 text-white animate-bounce\";
                icon = \"fa-fire text-red-500\";
            }

            const toastId = 'toast-' + Math.random().toString(36).substr(2, 9);

            const toastHTML = `
                <div id=\"${toastId}\" class=\"flex items-start gap-3 p-4 rounded-xl border ${colorClasses} shadow-xl transition-all duration-300 transform translate-x-10 opacity-0 pointer-events-auto max-w-sm\">
                    <i class=\"fa-solid ${icon} text-lg shrink-0 mt-0.5\"><\/i>
                    <div class=\"space-y-1\">
                        <h5 class=\"font-extrabold text-xs uppercase tracking-wider\">${title}<\/h5>
                        <p class=\"text-[11px] text-slate-300 leading-relaxed\">${msg}<\/p>
                    <\/div>
                    <button onclick=\"document.getElementById('${toastId}').remove()\" class=\"text-slate-500 hover:text-white shrink-0 ml-auto\"><i class=\"fa-solid fa-times text-xs\"><\/i><\/button>
                <\/div>
            `;

            toastContainer.insertAdjacentHTML('beforeend', toastHTML);

            \/\/ Trigger slide in
            setTimeout(() => {
                const tEl = document.getElementById(toastId);
                if (tEl) {
                    tEl.classList.remove('translate-x-10', 'opacity-0');
                }
            }, 50);

            \/\/ Trigger auto-remove
            setTimeout(() => {
                const tEl = document.getElementById(toastId);
                if (tEl) {
                    tEl.classList.add('translate-x-10', 'opacity-0');
                    setTimeout(() => tEl.remove(), 300);
                }
            }, 6000);
        }
